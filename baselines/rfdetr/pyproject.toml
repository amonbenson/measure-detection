[project]
name = "mdet-rfdetr-baseline"
version = "0.1.0"
description = "RF-DETR box-detector baseline (guideline section 6.4)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rfdetr[train]>=1.2",
    "torch>=2.8",
    "torchvision>=0.23",
    "pillow>=11.0",
    "numpy>=2.0",
]

[tool.uv]
python-preference = "managed"
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
