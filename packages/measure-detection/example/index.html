<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measure detection example</title>
<style>
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: #f4f3ef; color: #1d1d1b; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  progress { width: min(360px, 100%); }
  .page { position: relative; margin: 0 auto 16px; max-width: 900px; box-shadow: 0 1px 4px #0003; background: #fff; }
  .page canvas { display: block; width: 100%; }
  .page svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  polygon { fill: #2563eb14; stroke: #2563eb; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  polygon.low { fill: #dc26261a; stroke: #dc2626; }
  text { font: 600 11px system-ui, sans-serif; fill: #1d4ed8; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
  text.low { fill: #b91c1c; }
</style>
<script type="importmap">
{ "imports": {
  "onnxruntime-web": "/node_modules/onnxruntime-web/dist/ort.all.min.mjs",
  "pdfjs-dist": "/node_modules/pdfjs-dist/build/pdf.min.mjs"
} }
</script>
</head>
<body>
<header>
  <input type="file" id="file" accept="application/pdf">
  <label>First measure starts
    <select id="conv">
      <option value="system-edge">at the system's left edge</option>
      <option value="after-header">after clef and key</option>
    </select>
  </label>
  <progress id="bar" max="1" value="0"></progress>
  <span id="status">Choose a PDF.</span>
</header>
<main id="pages"></main>
<script type="module">
import * as ort from "onnxruntime-web";
import * as pdfjs from "pdfjs-dist";
import { MeasureDetector } from "../dist/index.js";

ort.env.wasm.wasmPaths = "/node_modules/onnxruntime-web/dist/";
pdfjs.GlobalWorkerOptions.workerSrc = "/node_modules/pdfjs-dist/build/pdf.worker.min.mjs";
const $ = (id) => document.getElementById(id);
const status = (text) => ($("status").textContent = text);
const LOW_CONFIDENCE = 0.5;

let detector;
async function getDetector() {
  detector ??= await MeasureDetector.create({
    models: { measurenet: "../models/measurenet.onnx", labelocr: "../models/labelocr.onnx" },
    decoder: await (await fetch("../models/decoder.json")).json(),
  });
  return detector;
}

// Draw each page and an SVG layer on top of it; returns the SVG per page.
async function showPages(pdf) {
  $("pages").innerHTML = "";
  const layers = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1.5 });
    const box = document.createElement("div");
    box.className = "page";
    const canvas = document.createElement("canvas");
    canvas.width = vp.width;
    canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    // Coordinates: page width = 1000 units, height = 1000 * aspect (uniform scale keeps text undistorted).
    svg.setAttribute("viewBox", `0 0 1000 ${1000 * (vp.height / vp.width)}`);
    box.append(canvas, svg);
    $("pages").append(box);
    layers.push({ svg, aspect: vp.height / vp.width });
  }
  return layers;
}

function drawMeasures(layers, measures) {
  for (const m of measures) {
    const { svg, aspect } = layers[m.layout.page];
    const h = 1000 * aspect;
    const low = m.confidence < LOW_CONFIDENCE ? "low" : "";
    const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    poly.setAttribute("points", m.quad.map(([x, y]) => `${x * 1000},${y * h}`).join(" "));
    poly.setAttribute("class", low);
    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = `Measure ${m.value}, confidence ${m.confidence.toFixed(2)}`;
    poly.append(title);
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", m.quad[0][0] * 1000 + 3);
    text.setAttribute("y", m.quad[0][1] * h - 3);
    text.setAttribute("class", low);
    text.textContent = m.value;
    svg.append(poly, text);
  }
}

$("file").addEventListener("change", async () => {
  const file = $("file").files[0];
  if (!file) return;
  $("file").disabled = true;
  try {
    status("Loading models...");
    const det = await getDetector();
    const pdf = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const layers = await showPages(pdf);
    const t0 = performance.now();
    const names = { scan: "Scanning pages", detect: "Detecting measures", label: "Reading measure numbers" };
    const weights = { scan: [0, 0.2], detect: [0.2, 0.75], label: [0.95, 0.05] };
    const measures = await det.detect(pdf, {
      startConvention: $("conv").value,
      onProgress: (done, total, stage) => {
        const [start, share] = weights[stage];
        $("bar").value = start + share * (done / total);
        status(stage === "label" ? names.label + "..." : `${names[stage]}: page ${done} of ${total}`);
      },
    });
    drawMeasures(layers, measures);
    $("bar").value = 1;
    const low = measures.filter((m) => m.confidence < LOW_CONFIDENCE).length;
    status(`${measures.length} measures on ${pdf.numPages} pages in ${((performance.now() - t0) / 1000).toFixed(1)} s (${det.provider}); ${low} marked red for review.`);
  } catch (err) {
    status(`Error: ${err}`);
    console.error(err);
  } finally {
    $("file").disabled = false;
  }
});
</script>
</body>
</html>
