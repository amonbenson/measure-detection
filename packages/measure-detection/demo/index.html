<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measure detection demo</title>
<style>
  :root { --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --accent: #c2410c; --line: #d6d3cd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1a; --fg: #ecebe7; --muted: #a3a29c; --accent: #fb923c; --line: #3a3936; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input[type=text] { width: min(520px, 100%); }
  #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; color: var(--muted); max-width: 100%; overflow-x: auto; }
  #pages { display: flex; flex-wrap: wrap; gap: 12px; }
  canvas { max-width: min(100%, 520px); border: 1px solid var(--line); background: #fff; }
</style>
<script type="importmap">
{ "imports": {
  "onnxruntime-web": "/node_modules/onnxruntime-web/dist/ort.all.min.mjs",
  "pdfjs-dist": "/node_modules/pdfjs-dist/build/pdf.min.mjs"
} }
</script>
</head>
<body>
<h1>Measure detection</h1>
<form id="f">
  <input type="text" id="pdf" placeholder="/dataset/documents/&lt;id&gt;/score.pdf">
  <select id="ep"><option value="webgpu">WebGPU</option><option value="wasm">WASM</option></select>
  <select id="conv"><option value="system-edge">system-edge</option><option value="after-header">after-header</option></select>
  <button>Detect</button>
</form>
<div id="log"></div>
<div id="pages"></div>
<script type="module">
import * as ort from "onnxruntime-web";
import * as pdfjs from "pdfjs-dist";
import { MeasureDetector } from "../dist/index.js";

ort.env.wasm.wasmPaths = "/node_modules/onnxruntime-web/dist/";
pdfjs.GlobalWorkerOptions.workerSrc = "/node_modules/pdfjs-dist/build/pdf.worker.min.mjs";
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
$("pdf").value = q.get("pdf") ?? "";
$("ep").value = q.get("ep") ?? "webgpu";
$("conv").value = q.get("conv") ?? "system-edge";
const log = (s) => { $("log").textContent += s + "\n"; };
window.demoResult = null;

async function run() {
  $("log").textContent = "";
  $("pages").innerHTML = "";
  const t0 = performance.now();
  const detector = await MeasureDetector.create({
    models: { measurenet: "../models/measurenet.onnx", labelocr: "../models/labelocr.onnx" },
    decoder: await (await fetch("../models/decoder.json")).json(),
    providers: [$("ep").value],
  });
  const tLoad = performance.now() - t0;
  log(`provider ${detector.provider}, models loaded in ${tLoad.toFixed(0)} ms`);
  const pdf = await pdfjs.getDocument({ url: $("pdf").value }).promise;
  const t1 = performance.now();
  let last = t1;
  const measures = await detector.detect(pdf, {
    startConvention: $("conv").value,
    onProgress: (done, total) => { const now = performance.now(); log(`page ${done}/${total}: ${(now - last).toFixed(0)} ms`); last = now; },
  });
  const total = performance.now() - t1;
  log(`${measures.length} measures, ${pdf.numPages} pages, ${(total / pdf.numPages).toFixed(0)} ms per page including labelling`);
  window.demoResult = { provider: detector.provider, pages: pdf.numPages, msPerPage: total / pdf.numPages, modelLoadMs: tLoad, measures };
  for (let p = 0; p < Math.min(pdf.numPages, 4); p++) {
    const page = await pdf.getPage(p + 1);
    const vp = page.getViewport({ scale: 1.2 });
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    const ctx = c.getContext("2d");
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    ctx.strokeStyle = "#c2410c"; ctx.fillStyle = "#c2410c"; ctx.lineWidth = 1.5; ctx.font = "12px sans-serif";
    for (const m of measures.filter((m) => m.layout.page === p)) {
      ctx.beginPath();
      m.quad.forEach(([x, y], i) => (i ? ctx.lineTo(x * c.width, y * c.height) : ctx.moveTo(x * c.width, y * c.height)));
      ctx.closePath(); ctx.stroke();
      ctx.fillText(m.value, m.quad[0][0] * c.width + 3, m.quad[0][1] * c.height + 12);
    }
    $("pages").append(c);
  }
}
$("f").addEventListener("submit", (e) => { e.preventDefault(); run().catch((err) => log(String(err))); });
if (q.get("pdf")) run().catch((err) => log(String(err)));
</script>
</body>
</html>
