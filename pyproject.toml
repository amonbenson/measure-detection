[project]
name = "mdet"
version = "0.1.0"
description = "Training and evaluation of measure detection for sheet music scans"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
    "pillow>=11.0",
    "pymupdf>=1.25",
    "torch>=2.8",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "tqdm>=4.66",
]

[project.scripts]
mdet = "mdet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdet"]

[tool.uv]
python-preference = "managed"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
